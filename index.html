    <style>
        /* ==========================================
           1. СБРОС И ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ (CRIMSON DARK)
           ========================================== */
        :root {
            --bg-color: #120606;
            --card-bg: rgba(45, 20, 20, 0.45);
            --card-border: rgba(229, 57, 53, 0.25);
            --accent-red: #ff3344;
            --accent-crimson: #e53935;
            --accent-glow: rgba(255, 51, 68, 0.25);
            --text-main: #f7f0f0;
            --text-muted: #a88c8c;
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Montserrat', sans-serif;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            overflow-x: hidden;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Ambient Background Glow */
        .ambient-glow {
            position: fixed;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(90px);
        }

        /* ==========================================
           2. ШАПКА И ТИПОГРАФИКА
           ========================================== */
        header {
            padding: 40px 20px 20px;
            text-align: center;
            position: relative;
        }

        header .subtitle {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--accent-red);
            margin-bottom: 12px;
            font-weight: 600;
        }

        header h1 {
            font-family: var(--font-serif);
            font-size: clamp(2.2rem, 5vw, 4rem);
            font-weight: 400;
            line-height: 1.1;
            background: linear-gradient(180deg, #ffffff 30%, #d9a3a3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        header p {
            max-width: 580px;
            margin: 0 auto;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 300;
        }

        /* ==========================================
           3. КОНТЕЙНЕР ВИКТОРИНЫ
           ========================================== */
        main {
            max-width: 760px;
            width: 90%;
            margin: 20px auto 60px;
            flex-grow: 1;
        }

        .progress-container {
            margin-bottom: 30px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e53935, #ff3344);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 8px;
            font-weight: 500;
        }

        /* Карточка вопроса */
        .quiz-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 30px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transition: var(--transition);
        }

        .question-title {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 25px;
            color: #ffffff;
            line-height: 1.35;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 18px 22px;
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover {
            background: rgba(255, 51, 68, 0.1);
            border-color: rgba(255, 51, 68, 0.4);
            transform: translateX(4px);
        }

        .option-btn.selected {
            background: linear-gradient(135deg, rgba(229, 57, 53, 0.25), rgba(255, 51, 68, 0.15));
            border-color: var(--accent-red);
            box-shadow: 0 0 20px rgba(255, 51, 68, 0.2);
            font-weight: 500;
        }

        .option-radio {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            transition: var(--transition);
            flex-shrink: 0;
            margin-left: 10px;
        }

        .option-btn.selected .option-radio {
            border-color: var(--accent-red);
            background: var(--accent-red);
            box-shadow: inset 0 0 0 3px #1d0b0b;
        }

        /* Текстовый ответ */
        .text-answer-container {
            margin-top: 15px;
        }

        textarea {
            width: 100%;
            height: 160px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 1rem;
            resize: vertical;
            outline: none;
            transition: var(--transition);
        }

        textarea:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        textarea::placeholder {
            color: rgba(168, 140, 140, 0.5);
        }

        /* Кнопки навигации */
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 35px;
        }

        .btn-nav {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 14px 28px;
            border-radius: 30px;
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-nav:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e53935, #ff3344);
            border: none;
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(255, 51, 68, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            box-shadow: 0 12px 30px rgba(255, 51, 68, 0.5);
            transform: translateY(-2px);
        }

        /* Экран результатов */
        .results-card {
            text-align: center;
            padding: 50px 30px;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 51, 68, 0.2) 0%, rgba(0,0,0,0) 70%);
            border: 3px solid var(--accent-red);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .score-num {
            font-family: var(--font-serif);
            font-size: 3rem;
            font-weight: 600;
            line-height: 1;
            color: var(--accent-red);
        }

        .score-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .results-title {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        .results-desc {
            color: var(--text-muted);
            max-width: 500px;
            margin: 0 auto 30px;
        }

        .status-msg {
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 0.95rem;
            display: none;
        }
        .status-msg.success {
            background: rgba(255, 51, 68, 0.15);
            border: 1px solid rgba(255, 51, 68, 0.3);
            color: #ff3344;
            display: block;
        }
        .status-msg.error {
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid rgba(231, 76, 60, 0.3);
            color: #e74c3c;
            display: block;
        }

        /* Loader */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s ease-in-out infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ==========================================
           4. FOOTER
           ========================================== */
        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--card-border);
            margin-top: 40px;
        }

        footer h3 {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 8px;
            color: #ffffff;
        }

        footer p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .quiz-card { padding: 25px 20px; }
            .question-title { font-size: 1.4rem; }
            .option-btn { padding: 14px 16px; font-size: 0.95rem; }
            .controls { flex-direction: column-reverse; gap: 12px; }
            .btn-nav { width: 100%; text-align: center; }
        }
    </style>
