<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glow & Memories | Crimson Quiz</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #120606;
            --card-bg: rgba(45, 20, 20, 0.75);
            --card-border: rgba(229, 57, 53, 0.35);
            --accent-red: #ff3344;
            --accent-glow: rgba(255, 51, 68, 0.25);
            --text-main: #f7f0f0;
            --text-muted: #a88c8c;
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Montserrat', sans-serif;
            
            --correct-bg: rgba(46, 125, 50, 0.5);
            --correct-border: #4caf50;
            --wrong-bg: rgba(211, 47, 47, 0.5);
            --wrong-border: #f44336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .ambient-glow {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(80px);
        }

        header {
            padding: 25px 15px 10px;
            text-align: center;
        }

        header .subtitle {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent-red);
            margin-bottom: 6px;
            font-weight: 600;
        }

        header h1 {
            font-family: var(--font-serif);
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 400;
            color: #ffffff;
            margin-bottom: 8px;
        }

        header p {
            max-width: 480px;
            margin: 0 auto;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        main {
            max-width: 680px;
            width: 92%;
            margin: 15px auto 30px;
            flex-grow: 1;
            position: relative;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e53935, #ff3344);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 8px 0 20px;
        }

        .quiz-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 25px 18px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
        }

        .quiz-card.shake {
            animation: shakeAnim 0.4s ease-in-out;
        }

        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-7px); }
            40%, 80% { transform: translateX(7px); }
        }

        .question-title {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 18px;
            color: #ffffff;
            line-height: 1.35;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 15px 16px;
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s ease;
            width: 100%;
            display: block;
            word-wrap: break-word;
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        .option-btn.correct {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: #ffffff;
            transform: scale(1.01);
            box-shadow: 0 0 18px rgba(76, 175, 80, 0.4);
        }

        .option-btn.wrong {
            background: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: #ffffff;
            box-shadow: 0 0 18px rgba(244, 67, 54, 0.4);
        }

        .floating-emoji {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 1.2s ease-out forwards;
            z-index: 9999;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.6) rotate(0deg); }
            50% { transform: translateY(-50px) scale(1.2) rotate(15deg); }
            100% { opacity: 0; transform: translateY(-100px) scale(1) rotate(-15deg); }
        }

        textarea {
            width: 100%;
            height: 130px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-red);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 22px;
            gap: 10px;
        }

        .btn-nav {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 22px;
            border-radius: 25px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e53935, #ff3344);
            border: none;
            color: #ffffff;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 25px 15px;
            border-top: 1px solid var(--card-border);
        }

        footer h3 {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: 400;
        }

        footer p {
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <header>
        <div class="subtitle">Private Quiz Collection</div>
        <h1>Насколько хорошо ты меня знаешь?</h1>
        <p>Ответь на эти вопросы от всего сердца. В конце я смогу прочитать твои ответы!</p>
    </header>

    <main id="mainContainer">
        <div id="progressBox">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <div class="progress-text">
                <span id="questionCounter">Вопрос 1</span>
                <span id="progressPercent">0%</span>
            </div>
        </div>

        <div id="quizContainer"></div>
    </main>

    <footer>
        <h3>Forever & Always</h3>
        <p>Специально создано, чтобы сохранить наши самые ценные моменты.</p>
    </footer>

    <script>
        const BOT_TOKEN = '8538283164:AAEjSnqdQMji9e03YVHjHL6Rqos-i7xKQGs';
        const CHAT_ID = '5913842104';

        const questions = [
            { id: 1, title: "1. Что делает меня по-настоящему счастливым?", options: ["Когда мы вместе играем.", "Когда ты присылаешь мне кружочек с поцелуем.", "Когда ты говоришь мне комплименты.", "Когда мы долго разговариваем по звонку."], correct: 1 },
            { id: 2, title: "🫶 2. Что я ценю в людях больше всего?", options: ["Искренность.", "Доброту.", "Верность.", "Чувство юмора."], correct: 2 },
            { id: 3, title: "🌙 3. Чего я боюсь сильнее всего?", options: ["Потерять человека, которого люблю.", "Остаться совсем один.", "Быть преданным.", "Что меня перестанут любить."], correct: 1 },
            { id: 4, title: "❤️ 4. Что сейчас является моей самой большой мечтой?", options: ["Провести с тобой всё лето.", "Увидеться с тобой и крепко тебя обнять.", "Поехать вместе отдыхать.", "Никогда больше не расставаться."], correct: 1 },
            { id: 5, title: "💔 5. Что может сильнее всего задеть мои чувства?", options: ["Когда меня игнорируют.", "Когда человек играет моими чувствами.", "Когда мне долго не отвечают.", "Когда забывают обо мне."], correct: 1 },
            { id: 6, title: "🎧 6. Что я чаще всего делаю, когда мне грустно?", options: ["Смотрю фильмы.", "Играю.", "Остаюсь один.", "Ложусь спать."], correct: 2 },
            { id: 7, title: "🎮 7. Какая из этих игр нравится мне больше всего?", options: ["Roblox.", "Minecraft.", "Brawl Stars.", "Standoff 2."], correct: 1 },
            { id: 8, title: "❤️ 8. Без чего я не представляю свой обычный день?", options: ["Без музыки.", "Без твоих сообщений.", "Без игр.", "Без YouTube."], correct: 1 },
            { id: 9, title: "🎨 9. Какой мой любимый цвет?", options: ["Бордовый.", "Красный.", "Чёрный.", "Белый."], correct: 1 },
            { id: 10, title: "💌 10. Какое сообщение от тебя делает меня счастливее всего?", options: ["«Доброе утро».", "«Я люблю тебя».", "Твой кружочек.", "«Как дела?»"], correct: 2 },
            { id: 11, title: "🥹 11. Какая моя привычка самая странная?", options: ["Часто переслушивать одну песню.", "Много писать, когда тревожусь или боюсь потерять человека.", "Проверять телефон каждые пять минут.", "Засыпать под музыку."], correct: 1 },
            { id: 12, title: "💗 12. Какое качество я считаю в себе самым сильным?", options: ["Внимательность.", "Доброту.", "Терпение.", "Смелость."], correct: 2 },
            { id: 13, title: "😊 13. Что, как мне кажется, больше всего нравится людям во мне?", options: ["Моё чувство юмора.", "Моё спокойствие.", "Моя доброта.", "Моё упрямство."], correct: 2 },
            { id: 14, title: "❤️ 14. Что я выберу, если придётся выбирать только одно?", options: ["Новый телефон.", "Миллион тенге.", "Один день рядом с тобой.", "Вернуться к бывшей."], correct: 2 },
            { id: 15, title: "🌹 15. Что я хочу, чтобы ты всегда помнила обо мне?", options: ["Что я всегда буду рядом.", "Что я очень люблю играть.", "Что я люблю музыку.", "Что я люблю красный цвет.", "Что я ценю тебя."], correct: 0 },
            { id: 16, title: "16. Если бы мне разрешили оставить в своей жизни только одну вещь, связанную с тобой, что бы я выбрал?", options: ["Наши фотографии.", "Твои кружочки.", "Нашу переписку.", "Наш первый подарок."], correct: 1 },
            { id: 17, title: "17. Как думаешь, какой у меня самый большой недостаток?", options: ["Я слишком доверчивый.", "Я слишком тревожный.", "Я слишком ленивый.", "Я слишком упрямый."], correct: 1 },
            { id: 18, title: "18. Опиши меня так, как будто рассказываешь о самом дорогом человеке в своей жизни.", isText: true, prompt: "Напиши своими словами от всего сердца 💗" },
            { id: 19, title: "19. Какие три мои качества ты бы никогда не хотела, чтобы изменились?", isText: true, prompt: "Напиши 3 качества, которые ценнее всего 💭" },
            { id: 20, title: "20. Какую часть своего характера я хотел бы изменить?", options: ["Стать менее тревожным.", "Стать увереннее.", "Стать терпеливее.", "Стать общительнее."], correct: 1 },
            { id: 21, title: "21. Какие причуды у меня есть от гастрита?", options: ["До еды болит живот.", "Наедаюсь чаю.", "Хочется постоянно пить.", "Хочется чаще кушать."], correct: 1 },
            { id: 22, title: "22. Какой смайлик я больше всего использую?", options: ["😂", "😔", "😝", "☺️"], correct: 2 },
            { id: 23, title: "23. Последний вопрос ❤️", isText: true, prompt: "А теперь без вариантов ответа. ❤️\n\nНапиши, какие мои качества или поступки ты любишь больше всего. Что во мне заставляет тебя улыбаться, чувствовать себя любимой или просто делает меня особенным для тебя?\n\nМне очень хочется прочитать именно твои мысли. Не торопись, напиши так, как чувствуешь. 💗" },
            { id: 24, title: "24. Ты бы согласилась стать моей девушкой?", options: ["Да!", "Конечно, любимый!", "Безусловно!", "Нет (даже не думай 😏)"], correct: [0, 1, 2] },
            { id: 25, title: "25. Если бы ты написала обо мне книгу, как бы она называлась?", isText: true, prompt: "Придумай самое красивое название для нашей истории 📖✨" },
            { id: 26, title: "26. Если бы тебе нужно было рассказать обо мне человеку, который никогда меня не видел, что бы ты сказала первым?", isText: true, prompt: "Какие первые слова приходят на ум? 💭" },
            { id: 27, title: "27. Что для меня страшнее?", options: ["Паук.", "Потерять интернет.", "Увидеть «печатает…» и потом ничего не получить.", "Будильник в 6 утра."], correct: 2 },
            { id: 28, title: "28. Если бы я был котом, каким?", options: ["Ленивым.", "Злым.", "Тем, который ходит за одним человеком по всей квартире.", "Тем, который всё роняет."], correct: 2 },
            { id: 29, title: "29. Что, как ты думаешь, скрывается за моей тревожностью?", options: ["Недоверие к людям.", "Страх потерять тех, кто дорог.", "Неуверенность в себе.", "Привычка всё контролировать."], correct: 1 }
        ];

        let currentIndex = 0;
        const answers = {};
        let canSelect = true;

        function render() {
            canSelect = true;
            const container = document.getElementById('quizContainer');
            const q = questions[currentIndex];

            if (!q) return;

            const total = questions.length;
            const pct = Math.round(((currentIndex + 1) / total) * 100);
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('questionCounter').innerText = `Вопрос ${currentIndex + 1} из ${total}`;
            document.getElementById('progressPercent').innerText = pct + '%';

            let html = `<div class="quiz-card" id="cardElement">`;
            html += `<h2 class="question-title">${q.title}</h2>`;

            if (q.isText) {
                const val = answers[q.id] || '';
                html += `
                    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; white-space: pre-line;">${q.prompt}</p>
                    <textarea id="textAns" placeholder="Напиши всё, что думаешь...">${val}</textarea>
                `;
            } else {
                html += `<div class="options-grid">`;
                q.options.forEach((opt, idx) => {
                    html += `<button class="option-btn" onclick="selectOption(${idx}, event)">${opt}</button>`;
                });
                html += `</div>`;
            }

            html += `<div class="controls">`;
            if (currentIndex > 0) {
                html += `<button class="btn-nav" onclick="prevQ()">Назад</button>`;
            } else {
                html += `<div></div>`;
            }

            if (currentIndex === total - 1) {
                html += `<button class="btn-nav btn-primary" onclick="sendResult()">Отправить ❤️</button>`;
            } else if (q.isText) {
                html += `<button class="btn-nav btn-primary" onclick="nextQ()">Далее</button>`;
            } else {
                html += `<div></div>`;
            }

            html += `</div></div>`;
            container.innerHTML = html;

            if (q.isText) {
                const txt = document.getElementById('textAns');
                if (txt) {
                    txt.addEventListener('input', (e) => {
                        answers[q.id] = e.target.value;
                    });
                }
            }
        }

        function spawnFloatingEmojis(x, y, isWin) {
            const emojis = isWin ? ['✨', '🦁', '💖', '🎉', '🌟'] : ['❌', '💔', '🥺'];
            for (let i = 0; i < 5; i++) {
                const span = document.createElement('span');
                span.className = 'floating-emoji';
                span.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                span.style.left = (x + (Math.random() * 60 - 30)) + 'px';
                span.style.top = (y + (Math.random() * 20 - 10)) + 'px';
                document.body.appendChild(span);

                setTimeout(() => span.remove(), 1200);
            }
        }

        function selectOption(idx, event) {
            if (!canSelect) return;
            canSelect = false;

            const q = questions[currentIndex];
            answers[q.id] = idx;

            const btns = document.querySelectorAll('.option-btn');
            const card = document.getElementById('cardElement');

            let isCorrect = false;
            if (Array.isArray(q.correct)) {
                isCorrect = q.correct.includes(idx);
            } else {
                isCorrect = (idx === q.correct);
            }

            // Используем currentTarget (гарантированная кнопка)
            const targetBtn = event.currentTarget || event.target;
            const rect = targetBtn.getBoundingClientRect();
            spawnFloatingEmojis(rect.left + rect.width / 2, rect.top, isCorrect);

            if (!isCorrect && card) {
                card.classList.add('shake');
            }

            btns.forEach((btn, i) => {
                let matchesCorrect = Array.isArray(q.correct) ? q.correct.includes(i) : (i === q.correct);
                if (matchesCorrect) {
                    btn.classList.add('correct');
                }
                if (i === idx && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });

            setTimeout(() => {
                if (currentIndex < questions.length - 1) {
                    currentIndex++;
                    render();
                }
            }, 1000);
        }

        function nextQ() {
            const q = questions[currentIndex];
            if (q.isText && (!answers[q.id] || !answers[q.id].trim())) {
                alert('Пожалуйста, напиши ответ на вопрос!');
                return;
            }
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                render();
            }
        }

        function prevQ() {
            if (currentIndex > 0) {
                delete answers[questions[currentIndex].id];
                currentIndex--;
                delete answers[questions[currentIndex].id];
                render();
            }
        }

        async function sendResult() {
            const lastQ = questions[questions.length - 1];
            if (lastQ.isText && (!answers[lastQ.id] || !answers[lastQ.id].trim())) {
                alert('Пожалуйста, напиши ответ на последний вопрос!');
                return;
            }

            let score = 0;
            let totalMC = 0;

            questions.forEach(q => {
                if (!q.isText) {
                    totalMC++;
                    let isRight = Array.isArray(q.correct) ? q.correct.includes(answers[q.id]) : (answers[q.id] === q.correct);
                    if (isRight) score++;
                }
            });

            let msg = `<b>💌 НОВЫЙ ОТВЕТ НА ВИКТОРИНУ!</b>\n\n`;
            msg += `<b>📊 Результат:</b> ${score} из ${totalMC}\n`;
            msg += `-----------------------------------\n\n`;

            questions.forEach(q => {
                if (q.isText) {
                    msg += `<b>${q.title}</b>\n<i>"${answers[q.id] || 'Пусто'}"</i>\n\n`;
                } else {
                    const ansText = answers[q.id] !== undefined ? q.options[answers[q.id]] : 'Не ответила';
                    let isRight = Array.isArray(q.correct) ? q.correct.includes(answers[q.id]) : (answers[q.id] === q.correct);
                    const mark = isRight ? '✅' : '❌';
                    msg += `<b>${q.title}</b>\nОтвет: ${ansText} ${mark}\n\n`;
                }
            });

            document.getElementById('quizContainer').innerHTML = `<div class="quiz-card" style="text-align:center;"><h3>Отправка...</h3></div>`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: 'HTML' })
                });
            } catch (e) {
                console.error(e);
            }

            document.getElementById('progressBox').style.display = 'none';
            document.getElementById('quizContainer').innerHTML = `
                <div class="quiz-card" style="text-align: center; padding: 40px 20px;">
                    <h2 style="font-family: var(--font-serif); font-size: 2rem; margin-bottom: 10px;">Спасибо за ответы! ❤️</h2>
                    <p style="color: var(--text-muted); margin-bottom: 20px;">Я уже всё получил и с удовольствием прочитал! Ты угадала <b>${score} из ${totalMC}</b> вопросов с вариантами ответов.</p>
                    <div style="background: rgba(255, 51, 68, 0.15); color: #ff3344; padding: 12px; border-radius: 10px; font-size: 0.9rem;">
                        Ответы успешно доставлены 💌
                    </div>
                </div>
            `;
        }
