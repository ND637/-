            flex-direction: column;
            justify-content: space-between;

            position: fixed;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);

            pointer-events: none;
            filter: blur(90px);
        }

        header {
            padding: 40px 20px 20px;
            text-align: center;
        }

        header .subtitle {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--accent-red);
            margin-bottom: 12px;
            font-weight: 600;

            line-height: 1.1;
            background: linear-gradient(180deg, #ffffff 30%, #d9a3a3 100%);

            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        header p {
            max-width: 580px;
            margin: 0 auto;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 300;
        }

        main {

            overflow: hidden;

        .progress-bar-fill {
            height: 100%;

            transition: width 0.4s ease;

            margin-top: 8px;
            font-weight: 500;

        .quiz-card {

            border-radius: 24px;
            padding: 35px 25px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);

        .question-title {

            margin-bottom: 25px;
            color: #ffffff;

            align-items: center;
            justify-content: space-between;
            width: 100%;

        /* Стиль при правильном ответе */
        .option-btn.correct {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);

            border-color: var(--wrong-border) !important;
            box-shadow: 0 0 15px rgba(244, 67, 54, 0.4);
            color: #ffffff;
        }

        .option-radio {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            transition: var(--transition);
            flex-shrink: 0;
            margin-left: 10px;
        }

        .option-btn.correct .option-radio {
            border-color: var(--correct-border);
            background: var(--correct-border);
        }

        .option-btn.wrong .option-radio {
            border-color: var(--wrong-border);
            background: var(--wrong-border);
        }

            width: 100%;
            height: 160px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 1rem;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 35px;
            gap: 15px;
        }

        .btn-nav {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 14px 28px;
            border-radius: 30px;
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: linear-gradient(135deg, #e53935, #ff3344);
            border: none;
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(255, 51, 68, 0.3);
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--card-border);
            margin-top: 40px;
        }

        footer h3 {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 8px;
        }

        footer p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

            .quiz-card { padding: 25px 18px; }
            .question-title { font-size: 1.4rem; }
            .controls { flex-direction: column-reverse; gap: 12px; }
            .btn-nav { width: 100%; text-align: center; }
        }
