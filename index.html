<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow & Memories | Crimson Quiz</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #120606;
            --card-bg: rgba(45, 20, 20, 0.65);
            --card-border: rgba(229, 57, 53, 0.3);
            --accent-red: #ff3344;
            --accent-glow: rgba(255, 51, 68, 0.25);
            --text-main: #f7f0f0;
            --text-muted: #a88c8c;
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Montserrat', sans-serif;
            
            --correct-bg: rgba(46, 125, 50, 0.4);
            --correct-border: #4caf50;
            --wrong-bg: rgba(211, 47, 47, 0.4);
            --wrong-border: #f44336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .ambient-glow {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(80px);
        }

        header {
            padding: 30px 20px 10px;
            text-align: center;
        }

        header .subtitle {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent-red);
            margin-bottom: 8px;
            font-weight: 600;
        }

        header h1 {
            font-family: var(--font-serif);
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 400;
            color: #ffffff;
            margin-bottom: 10px;
        }

        header p {
            max-width: 500px;
            margin: 0 auto;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        main {
            max-width: 680px;
            width: 92%;
            margin: 20px auto 40px;
            flex-grow: 1;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e53935, #ff3344);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 8px 0 25px;
        }

        .quiz-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .question-title {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 400;
            margin-bottom: 20px;
            color: #ffffff;
            line-height: 1.3;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 16px 18px;
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .option-btn:active {
            transform: scale(0.99);
        }

        .option-btn.correct {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: #ffffff;
        }

        .option-btn.wrong {
            background: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: #ffffff;
        }

        textarea {
            width: 100%;
            height: 140px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-red);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            gap: 10px;
        }

        .btn-nav {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e53935, #ff3344);
            border: none;
            color: #ffffff;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid var(--card-border);
        }

        footer h3 {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 400;
        }

        footer p {
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

        <div id="quizContainer"></div>
    </main>

    <footer>
        <h3>Forever & Always</h3>
        <p>Специально создано, чтобы сохранить наши самые ценные моменты.</p>
    </footer>

    <script>
        const BOT_TOKEN = '8538283164:AAEjSnqdQMji9e03YVHjHL6Rqos-i7xKQGs';
        const CHAT_ID = '5913842104';

        const questions = [
            {

            {

                ],

                ],

                    "Много писать, когда тревожусь или боюсь потерять человека.",
                    "Проверять телефон каждые пять минут.",

            {

                options: [

            {

                title: "😊 13. Что, как мне кажется, больше всего нравится людям во мне?",
                options: [
                    "Моё чувство юмора.",

                options: [

            {
                id: 16,
                title: "16. Если бы мне разрешили оставить в своей жизни только одну вещь, связанную с тобой, что бы я выбрал?",
                options: [
                    "Наши фотографии.",
                    "Твои кружочки.",
                    "Нашу переписку.",
                    "Наш первый подарок."
                ],
                correct: 1
            },
            {
                id: 17,
                title: "17. Как думаешь, какой у меня самый большой недостаток?",
                options: [
                    "Я слишком доверчивый.",
                    "Я слишком тревожный.",
                    "Я слишком ленивый.",
                    "Я слишком упрямый."
                ],
                correct: 1
            },
            {
                id: 18,
                title: "18. Опиши меня так, как будто рассказываешь о самом дорогом человеке в своей жизни.",
                isText: true,
                prompt: "Напиши своими словами от всего сердца 💗"
            },
            {
                id: 19,
                title: "19. Какие три мои качества ты бы никогда не хотела, чтобы изменились?",
                isText: true,
                prompt: "Напиши 3 качества, которые ценнее всего 💭"
            },
            {
                id: 20,
                title: "20. Какую часть своего характера я хотел бы изменить?",
                options: [
                    "Стать менее тревожным.",
                    "Стать увереннее.",
                    "Стать терпеливее.",
                    "Стать общительнее."
                ],
                correct: 1
            },
            {
                id: 21,
                title: "21. Какие причуды у меня есть от гастрита?",
                options: [
                    "До еды болит живот.",
                    "Наедаюсь чаю.",
                    "Хочется постоянно пить.",
                    "Хочется чаще кушать."
                ],
                correct: 1
            },
            {
                id: 22,
                title: "22. Какой смайлик я больше всего использую?",
                options: [
                    "😂",
                    "😔",
                    "😝",
                    "☺️"
                ],
                correct: 2
            },
            {
                id: 23,
                title: "Последний вопрос ❤️",
                isText: true,
                prompt: "А теперь без вариантов ответа. ❤️\n\nНапиши, какие мои качества или поступки ты любишь больше всего. Что во мне заставляет тебя улыбаться, чувствовать себя любимой или просто делает меня особенным для тебя?\n\nМне очень хочется прочитать именно твои мысли. Не торопись, напиши так, как чувствуешь. 💗"
            }
        ];

        let currentIndex = 0;
        const answers = {};
        let canSelect = true;

        function render() {
            canSelect = true;
            const container = document.getElementById('quizContainer');
            const q = questions[currentIndex];

            // Обновляем прогресс
            const total = questions.length;
            const pct = Math.round(((currentIndex + 1) / total) * 100);
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('questionCounter').innerText = `Вопрос ${currentIndex + 1} из ${total}`;
            document.getElementById('progressPercent').innerText = pct + '%';

            let html = `<div class="quiz-card">`;
            html += `<h2 class="question-title">${q.title}</h2>`;

            if (q.isText) {
                const val = answers[q.id] || '';
                html += `
                    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; white-space: pre-line;">${q.prompt}</p>
                    <textarea id="textAns" placeholder="Напиши всё, что думаешь...">${val}</textarea>
                `;
            } else {
                html += `<div class="options-grid">`;
                q.options.forEach((opt, idx) => {
                    html += `<button class="option-btn" onclick="selectOption(${idx})">${opt}</button>`;
                });
                html += `</div>`;
            }

            html += `<div class="controls">`;
            
            // Кнопка НАЗАД
            if (currentIndex > 0) {
                html += `<button class="btn-nav" onclick="prevQ()">Назад</button>`;
            } else {
                html += `<div></div>`;
            }

            // Кнопка ДАЛЕЕ / ОТПРАВИТЬ
            if (currentIndex === total - 1) {
                html += `<button class="btn-nav btn-primary" onclick="sendResult()">Отправить ❤️</button>`;
            } else if (q.isText) {
                html += `<button class="btn-nav btn-primary" onclick="nextQ()">Далее</button>`;
            } else {
                html += `<div></div>`;
            }

            html += `</div></div>`;
            container.innerHTML = html;

            if (q.isText) {
                document.getElementById('textAns').addEventListener('input', (e) => {
                    answers[q.id] = e.target.value;
                });
            }
        }

        function selectOption(idx) {
            if (!canSelect) return;
            canSelect = false;

            const q = questions[currentIndex];
            answers[q.id] = idx;

            const btns = document.querySelectorAll('.option-btn');
            
            btns.forEach((btn, i) => {
                if (i === q.correct) {
                    btn.classList.add('correct');
                }
                if (i === idx && idx !== q.correct) {
                    btn.classList.add('wrong');
                }
            });

            setTimeout(() => {
                if (currentIndex < questions.length - 1) {
                    currentIndex++;
                    render();
                }
            }, 1000);
        }

        function nextQ() {
            const q = questions[currentIndex];
            if (q.isText && (!answers[q.id] || !answers[q.id].trim())) {
                alert('Пожалуйста, напиши ответ на вопрос!');
                return;
            }
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                render();
            }
        }

        function prevQ() {
            if (currentIndex > 0) {
                // Очищаем ответ текущего и предыдущего вопроса при шаге назад
                delete answers[questions[currentIndex].id];
                currentIndex--;
                delete answers[questions[currentIndex].id];
                render();
            }
        }

        async function sendResult() {
            const lastQ = questions[questions.length - 1];
            if (lastQ.isText && (!answers[lastQ.id] || !answers[lastQ.id].trim())) {
                alert('Пожалуйста, напиши ответ на последний вопрос!');
                return;
            }

            let score = 0;
            let totalMC = 0;

            questions.forEach(q => {
                if (!q.isText) {
                    totalMC++;
                    if (answers[q.id] === q.correct) score++;
                }
            });

            let msg = `<b>💌 НОВЫЙ ОТВЕТ НА ВИКТОРИНУ!</b>\n\n`;
            msg += `<b>📊 Результат:</b> ${score} из ${totalMC}\n`;
            msg += `-----------------------------------\n\n`;

            questions.forEach(q => {
                if (q.isText) {
                    msg += `<b>${q.title}</b>\n<i>"${answers[q.id] || 'Пусто'}"</i>\n\n`;
                } else {
                    const ansText = answers[q.id] !== undefined ? q.options[answers[q.id]] : 'Не ответила';
                    const mark = answers[q.id] === q.correct ? '✅' : '❌';
                    msg += `<b>${q.title}</b>\nОтвет: ${ansText} ${mark}\n\n`;
                }
            });

            document.getElementById('quizContainer').innerHTML = `<div class="quiz-card" style="text-align:center;"><h3>Отправка...</h3></div>`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: 'HTML' })
                });
            } catch (e) {
                console.error(e);
            }

            document.getElementById('progressBox').style.display = 'none';
            document.getElementById('quizContainer').innerHTML = `
                <div class="quiz-card" style="text-align: center; padding: 40px 20px;">
                    <h2 style="font-family: var(--font-serif); font-size: 2rem; margin-bottom: 10px;">Спасибо за ответы! ❤️</h2>
                    <p style="color: var(--text-muted); margin-bottom: 20px;">Я уже всё получил и с удовольствием прочитал! Ты угадала <b>${score} из ${totalMC}</b> вопросов с вариантами ответов.</p>
                    <div style="background: rgba(255, 51, 68, 0.15); color: #ff3344; padding: 12px; border-radius: 10px; font-size: 0.9rem;">
                        Ответы успешно доставлены 💌
                    </div>
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
